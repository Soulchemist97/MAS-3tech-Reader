[package]
name = "mas-reader"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "src-tauri"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
printpdf = "0.12.8"
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
rust_xlsxwriter = "0.102.0"
