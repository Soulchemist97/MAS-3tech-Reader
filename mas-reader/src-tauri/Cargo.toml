[package]
name = "mas-reader-gui"
version = "0.1.0"
description = "MAS Reader: Quittungen aus Spielautomaten auswerten"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mas-reader = { path = ".." }
chrono = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
